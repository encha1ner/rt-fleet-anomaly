services:
  influxdb:
    image: influxdb:3-core
    container_name: fleet-influx
    ports:
      - "8181:8181"
    command:
      - influxdb3
      - serve 
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3
      - --without-auth
    volumes:
      - influx-data:/var/lib/influxdb3

volumes:
  influx-data:


